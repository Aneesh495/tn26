[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tn26"
version = "1.0.0"
description = "Tamil Nadu 2026 Legislative Assembly Election: Computational Social Science, Econometrics, and Machine Learning Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aneesh Krishna Parthasarathy", email = "aneeshkrishnaparthasarathy@gmail.com" }
]
keywords = [
    "political-science",
    "computational-social-science",
    "machine-learning",
    "bayesian-statistics",
    "causal-inference",
    "electoral-forensics",
    "tamil-nadu-2026",
    "econometrics",
    "nlp",
    "dirichlet-multinomial"
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "networkx>=3.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tn26*"]
